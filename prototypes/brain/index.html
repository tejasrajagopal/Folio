<canvas id="cv" aria-label="A glowing amber brain floating in dark water inside a round glass jar. Drag to tilt the jar; double click to set it straight."></canvas>

<!-- shared: the dark studio that the glass and the wet surface of the brain both mirror -->
<script id="studio" type="x-shader/x-fragment">
uniform mat3 uEnvRot;     // the room's orientation (fixed: only the jar turns)
uniform vec4 uLights;     // softbox, window, overhead lamp, edge kicker
// a soft-edged panel of light, in angle space: 1 inside, falling to 0 over `soft`
float panel(vec2 p, vec2 half_, float soft){
  vec2 d = abs(p) - half_;
  return smoothstep(soft, 0., max(d.x, d.y));
}
// What the room looks like in direction r. Everything that shines mirrors this:
// a tall softbox on the left, a paned window on the right,
// a lamp overhead, and a dim floor and back wall.
vec3 studio(vec3 r){
  r = uEnvRot*r;
  float az = atan(r.x, -r.z);                    // 0 = straight behind the jar, + to the right
  float el = asin(clamp(r.y, -1., 1.));
  vec3 c = vec3(.008, .009, .011);

  // left: a tall softbox, a touch brighter toward its middle, with the seam of its diffuser
  vec2 lp = vec2(az + 1.30, el - .08);
  float box = panel(lp, vec2(.115, .86), .07);
  box *= (.72 + .28*exp(-lp.y*lp.y*2.))*(1. - .35*smoothstep(.012, .004, abs(lp.y + .22)));
  c += vec3(.94, .97, 1.)*box*15.*uLights.x;

  // right: daylight through a window, two panes wide and three high
  vec2 wp = vec2(az - 1.27, el - .10);
  float win = panel(wp, vec2(.15, .72), .035);
  float bars = smoothstep(.006, .016, abs(wp.x))
             *smoothstep(.010, .022, abs(wp.y - .24))*smoothstep(.010, .022, abs(wp.y + .24));
  c += vec3(1., .95, .86)*win*bars*11.*uLights.y;

  // a thin kicker further behind, the hard line near the jar's edge
  c += vec3(.9, .95, 1.)*smoothstep(.045, .012, abs(abs(az) - .78))*smoothstep(.9, .3, abs(el))*1.6*uLights.w;

  // overhead lamp, the back wall's faint glow, and a little bounce off the floor
  c += vec3(1., .97, .92)*smoothstep(.88, .98, r.y)*1.1*uLights.z;
  c += vec3(.8, .88, 1.)*smoothstep(.75, 0., abs(az))*(.5 + .5*smoothstep(-.6, .5, r.y))*.07;
  c += vec3(.5, .45, .4)*smoothstep(-.35, -.95, r.y)*.05;
  return c;
}
</script>


<!-- shared: the sea's surface. Gerstner waves, a slosh, choppy detail, and the ripple simulation -->
<script id="water" type="x-shader/x-fragment">
uniform float uSea;           // resting water level
uniform vec4  uWaves[8];      // direction x, direction z, wavenumber, amplitude
uniform float uWPhase[8];
uniform vec4  uSlosh;         // the four standing slosh modes of the bowl
uniform float uDetailAmp, uRDisc, uSimOn;
uniform int   uDetailOct;
uniform sampler2D uSim;       // ripple simulation: height in r
float wHash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float wNoise(vec2 p){ vec2 i = floor(p), f = fract(p), u = f*f*(3. - 2.*f);
  return mix(mix(wHash(i), wHash(i + vec2(1, 0)), u.x), mix(wHash(i + vec2(0, 1)), wHash(i + vec2(1, 1)), u.x), u.y); }
// one octave of sharp, folded chop
float seaOctave(vec2 uv, float choppy){
  uv += wNoise(uv)*2. - 1.;
  vec2 wv = 1. - abs(sin(uv)), swv = abs(cos(uv));
  wv = mix(wv, swv, wv);
  return pow(1. - pow(wv.x*wv.y, .65), choppy);
}
float detailH(vec2 p, int iters){
  float freq = 7.5, amp = uDetailAmp, choppy = 3.6, h = 0.;
  vec2 uv = p; uv.x *= .8;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  float tt = uTime*.32;
  for (int i = 0; i < 8; i++){
    if (i >= iters) break;
    h += (seaOctave((uv + tt)*freq, choppy) + seaOctave((uv - tt)*freq, choppy))*amp;
    uv = m*uv; freq *= 1.9; amp *= .24; choppy = mix(choppy, 1., .2);
  }
  return h - uDetailAmp*.8;
}
float sloshH(vec2 p){ vec2 q = p/max(uRDisc, .05);
  return uSlosh.x*sin(1.5707963*q.x) + uSlosh.y*sin(1.5707963*q.y) + uSlosh.z*cos(3.1415927*q.x) + uSlosh.w*cos(3.1415927*q.y); }
vec2 sloshG(vec2 p){ float R = max(uRDisc, .05); vec2 q = p/R;
  return vec2(uSlosh.x*1.5707963*cos(1.5707963*q.x) - uSlosh.z*3.1415927*sin(3.1415927*q.x),
              uSlosh.y*1.5707963*cos(1.5707963*q.y) - uSlosh.w*3.1415927*sin(3.1415927*q.y))/R; }
float gerstnerY(vec2 p){ float h = 0.; for (int i = 0; i < 8; i++){ vec4 w = uWaves[i]; h += w.w*sin(w.z*dot(w.xy, p) - uWPhase[i]); } return h; }
vec2 gerstnerG(vec2 p){ vec2 g = vec2(0.); for (int i = 0; i < 8; i++){ vec4 w = uWaves[i]; g += w.xy*w.z*w.w*cos(w.z*dot(w.xy, p) - uWPhase[i]); } return g; }
float simH(vec2 p){ return uSimOn > .5 ? textureLod(uSim, clamp(p*.5 + .5, .002, .998), 0.).r : 0.; }
float waterH(vec2 p){ return uSea + sloshH(p) + gerstnerY(p) + detailH(p, 2) + simH(p); }
vec3 waterN(vec2 p, int oct){
  vec2 g = gerstnerG(p) + sloshG(p);
  const float e = .004;
  g.x += (detailH(p + vec2(e, 0.), oct) - detailH(p - vec2(e, 0.), oct))/(2.*e);
  g.y += (detailH(p + vec2(0., e), oct) - detailH(p - vec2(0., e), oct))/(2.*e);
  const float es = 2./256.;
  g.x += (simH(p + vec2(es, 0.)) - simH(p - vec2(es, 0.)))/(2.*es);
  g.y += (simH(p + vec2(0., es)) - simH(p - vec2(0., es)))/(2.*es);
  return normalize(vec3(-g.x, 1., -g.y));
}
</script>

<script id="brain-vs" type="x-shader/x-vertex">#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
layout(location=2) in vec2 aUV;
layout(location=3) in vec3 aTan;
uniform mat3 uBrain;      // brain -> world
uniform vec3 uBrainPos, uCamPos;
uniform mat3 uCamInv;
uniform vec2 uProj;
uniform float uSwell;     // size on this beat (1 = at rest)
out vec3 vL, vW, vN, vT;
out vec2 vUV;
const vec3 SC = vec3(1.14, .985, .96)*.74;    // the water magnifies it back up
void main(){
  vec3 w = uBrain*(aPos*SC*uSwell) + uBrainPos;
  vL = aPos; vW = w; vUV = aUV;
  vN = uBrain*(aNor/SC); vT = uBrain*(aTan*SC);
  vec3 pc = uCamInv*(w - uCamPos);
  float d = -pc.z;
  gl_Position = vec4(pc.xy*uProj, (d - 9.)/1.6*d, d);
}
</script>

<script id="brain-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uTissue, uNormals;
uniform mat3 uBrain;
uniform vec3 uBrainPos, uCamPos;
uniform float uPulse, uTime, uScale;
uniform vec3 uBody, uCore;     // the amber of the brain, and the hotter colour of its heart
uniform float uGlow, uRimB, uWet, uSpec, uBeatPhase, uBeatWave;
in vec3 vL, vW, vN, vT;
in vec2 vUV;
out vec4 outColor;
//STUDIO

// colours are linear light: the tone curve at the end turns strong orange into yellow, then white
#define AMBER uBody
#define HOT uCore
#define DEEP (uBody*vec3(.075, .036, .0))

// a heat wave radiates from low in the cortex and bends around the folds
float heatPhase(vec3 p, float ridge){
  vec3 source = vec3(-.12, -.29, .14);
  float radius = length((p - source)*vec3(1., .91, 1.12));
  return radius*8.4 + .46*sin(p.y*7. + p.z*4.) + .34*sin(5.*p.x - 3.*p.z) + .48*ridge;
}

void main(){
  vec3 ng = normalize(vN), t = normalize(vT - ng*dot(ng, vT));
  vec3 bump = texture(uNormals, vUV).xyz*2. - 1.;
  bump.xy *= 1.25;
  vec3 n = normalize(t*bump.x - cross(ng, t)*bump.y + ng*bump.z);
  vec3 v = normalize(uCamPos - vW);
  if (dot(ng, v) < 0.){ ng = -ng; n = -n; }
  float ndv = clamp(dot(n, v), 0., 1.), gdv = clamp(dot(ng, v), 0., 1.);

  // the painted tissue map is pale on the crowns and dark red down in the grooves
  vec3 skin = texture(uTissue, vUV).rgb;
  float lum = dot(skin, vec3(.3, .5, .2));
  float crown = smoothstep(.27, .62, lum);
  float vein = smoothstep(.5, .25, skin.g/max(skin.r, .01));     // fine red vessels

  // a light burns in the middle: what reaches the eye depends on how near the line of sight passes it
  vec3 heartW = uBrainPos + uBrain*vec3(0., -.10, -.02);
  vec3 toH = heartW - vW;
  vec3 perp = toH + v*dot(toH, -v);
  float core = exp(-dot(perp, perp)/.125)*uPulse;
  // slow waves of light travelling outward through the folds
  float wave = .5 + .5*sin(9.*length(vL - vec3(0., -.1, 0.)) + 2.5*lum - uTime*.9);
  core *= .84 + .26*wave;

  // the amber body, lit softly from the front; grooves fall away to a deep red-brown
  vec3 c = mix(DEEP, AMBER*.62, crown)*(.05 + .95*ndv*ndv);
  c *= 1. - .5*vein;
  // light from within: crowns near the heart burn yellow, the grooves between them stay orange
  c += mix(AMBER*.75, HOT*4.4, crown*crown*crown)*pow(core, 1.4)*(.45 + .55*ndv)*uGlow;
  // the split between the halves is a seam of light
  float seam = smoothstep(.05, .0, abs(vL.x))*smoothstep(-.1, .25, vL.z);
  c += HOT*2.6*seam*(.25 + core)*uGlow;
  // thin edges let light through
  c += AMBER*pow(1. - gdv, 2.6)*(.35 + .9*core)*uRimB;

  // the pulse: a wave of light runs out from low in the cortex on every beat, in amber only
  float wave2 = .5 + .5*cos(heatPhase(vL, crown) - uBeatPhase*6.2831853);   // one wave per heartbeat
  wave2 = pow(wave2, 3.);
  c += mix(AMBER, HOT*1.6, crown)*wave2*(.2 + .8*core)*.6*uBeatWave*uGlow;
  c *= uPulse;                                    // the whole brain brightens on the beat

  // a wet, glassy skin: it mirrors the studio and carries tight highlights
  float F = .045 + .955*pow(1. - ndv, 5.);
  c += studio(reflect(-v, n))*F*(.25 + .75*crown)*vec3(1., .62, .26)*.9*uWet;
  vec3 l1 = normalize(vec3(-.35, .55, .76)), l2 = normalize(vec3(.5, -.2, .84)), l3 = normalize(vec3(.1, .9, .42));
  float s = pow(max(dot(n, normalize(l1 + v)), 0.), 120.)*2.6
          + pow(max(dot(n, normalize(l2 + v)), 0.), 60.)*.7
          + pow(max(dot(n, normalize(l3 + v)), 0.), 90.)*1.2;
  c += vec3(1., .80, .50)*s*(.2 + .8*crown)*uSpec;

  outColor = vec4(c*uScale, 1.);
}
</script>

<script id="scene-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp sampler2D;

uniform vec2  uRes;
uniform float uTime;
uniform float uView;      // world units across the screen height
uniform vec3  uCamPos;
uniform mat3  uCam;       // camera basis (columns: right, up, back)
uniform vec3  uBrainPos;
uniform float uPulse, uScale;
uniform mat3  uJar, uJarInv;  // the jar's own tilt (jar -> world, world -> jar); the brain and the sea stay put
uniform vec3  uWaterTint;     // what fraction of each colour survives a unit of water
uniform vec3  uInscat;        // the water's own dim glow
uniform vec3  uLampCol, uLampDir;
uniform float uMurk, uClarity, uMotes, uWaterGlow, uCaustics, uGodRays;
uniform int   uRaySteps;
uniform sampler2D uCaustic;   // light focused by the waves, on a plane through the brain
uniform vec3  uRipples;       // seconds since each of the last three beats
uniform float uRipple, uRippleSpeed;
uniform float uGlassRefl, uGlassTint, uBloom, uBrainBehind;

uniform mat3  uCamInv;
uniform vec2  uProjUV;     // world offset at the jar -> screen uv
uniform sampler2D uSpecimen;   // the brain, already drawn, with its blurred copies in the mip chain
out vec4 outColor;
//STUDIO
//WATER

const float CAM_D = 9.0;

float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b - a)/k, 0., 1.); return mix(b, a, h) - k*h*(1. - h); }

float sdBox2(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
// the jar's profile, spun around the y axis: q = (distance from the axis, height)
float jar2(vec2 q){
  const float T = .0115;
  float body = abs(length(q) - 1.) - T;
  body = max(body, q.y - .925);
  body = max(body, -.935 - q.y);
  float neck = max(abs(q.x - .392) - T, abs(q.y - .965) - .055);
  float shell = smin(body, neck, .05);
  float lip  = sdBox2(q - vec2(.445, 1.035), vec2(.068, .05), .046);
  float foot = sdBox2(q - vec2(0., -.878), vec2(.365, .07), .028);
  return min(smin(shell, lip, .025), smin(shell, foot, .03));
}
float jar(vec3 p){ p = uJarInv*p; return jar2(vec2(length(p.xz), p.y)); }
vec3 jarNormal(vec3 p){
  p = uJarInv*p;
  float r = max(length(p.xz), 1e-4);
  vec2 q = vec2(r, p.y);
  const vec2 e = vec2(.0015, 0.);
  vec2 g = vec2(jar2(q + e.xy) - jar2(q - e.xy), jar2(q + e.yx) - jar2(q - e.yx));
  return uJar*normalize(vec3(g.x*p.x/r, g.y, g.x*p.z/r));
}

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }

/* ---------- the ocean in the jar ---------- */
#define SEA uSea                               // resting water level
const float BOWL = .986;                       // inner radius of the glass
// a ring of ripple spreading from above the brain, `age` seconds after a beat
float ring(float r, float age){
  float front = r - age*uRippleSpeed;
  return exp(-age*.75)*exp(-front*front*40.)*sin(front*30.);
}
// height of the surface above its resting level, and its normal (fine detail on, for shading)
float swell(vec2 p){ return waterH(p) - uSea; }
vec3 swellNormal(vec2 p){ return waterN(p, uDetailOct); }
// the focused light (caustics) at a point under the water, found by following the light down to the plane
const float CPLANE = -.05;
vec3 lightIn(){ return refract(uLampDir, vec3(0., 1., 0.), 1./1.336); }
vec3 causticAt(vec3 wp){
  vec3 Lw = lightIn();
  vec2 xz = wp.xz + Lw.xz*((wp.y - CPLANE)/(-Lw.y));
  return textureLod(uCaustic, clamp(xz*.5 + .5, .001, .999), .9).rgb;
}
// drifting specks and rising bubbles
float motes(vec2 p, float scale, float rise, float seed){
  vec2 g = p*scale + vec2(seed*13.7, -uTime*rise);
  vec2 id = floor(g), f = fract(g) - .5;
  vec2 o = vec2(hash(id + seed), hash(id + seed + 31.7)) - .5;
  o.x += .12*sin(uTime*1.3 + hash(id)*40.);
  float live = step(.62, hash(id + seed + 5.3));
  return smoothstep(.07, .0, length(f - o*.7))*live;
}


// one soft tap of a blurred copy of the brain
vec4 soft(vec2 uv, float lod){
  vec2 px = exp2(lod)/uRes*.75;
  return (textureLod(uSpecimen, uv + px*vec2(1., 1.), lod) + textureLod(uSpecimen, uv + px*vec2(-1., 1.), lod)
        + textureLod(uSpecimen, uv + px*vec2(1., -1.), lod) + textureLod(uSpecimen, uv + px*vec2(-1., -1.), lod))*.25;
}

/* ---------- real optics for the bowl ----------
   The bowl is two spheres (the glass's outer and inner faces). A ray is followed through each
   face with Snell's law, separately for red, green and blue, since glass and water bend each
   colour a little differently. Inside, it may meet the sea's surface (and be mirrored back down
   when it strikes from below at a steep angle), passes the brain, and leaves through the back. */
const float R_OUT = 1.0115, R_IN = .9885, BODY_TOP = .925;
vec2 sph(vec3 o, vec3 d, float r){
  float b = dot(o, d), c = dot(o, o) - r*r, h = b*b - c;
  if (h < 0.) return vec2(-1.);
  h = sqrt(h); return vec2(-b - h, -b + h);
}
// refract, or reflect when the light cannot get out (total internal reflection)
vec3 bend(vec3 d, vec3 n, float eta, inout float tir){
  vec3 t = refract(d, n, eta);
  if (dot(t, t) < 1e-6){ tir = 1.; return reflect(d, n); }
  return t;
}
float schlick(float cosi, float f0){ return f0 + (1. - f0)*pow(1. - cosi, 5.); }
// where a point in the jar lands in the picture of the brain
vec2 toUV(vec3 q){ vec3 pc = uCamInv*(q - uCamPos); return .5 + pc.xy/(-pc.z)*uProjUV; }

struct Path {
  vec2 uv;          // where the bent ray passes the brain, in the brain's picture
  float glass;      // distance travelled inside glass
  float water;      // distance travelled inside water
  float toBrain;    // water travelled before reaching the brain
  float waterY;     // height of the middle of the water stretch
  vec3 exitDir;     // direction it leaves the jar in
  float keep;       // light kept after the reflections at each face
  float surf;       // 1 when the ray met the sea's surface
  float tir;        // 1 when the surface mirrored it back down
  vec3 surfP, surfN, surfD;
  vec3 brainP;      // the point beside the brain the ray passed closest to
  vec3 wO, wD;      // start and direction of its first stretch through water
  float wLen;
  vec3 wallP;       // where it met the far side of the bowl
};

bool traceBowl(vec3 ro, vec3 rd, float ng, float nw, out Path P){
  P = Path(vec2(-1.), 0., 0., 0., 0., rd, 1., 0., 0., vec3(0.), vec3(0., 1., 0.), rd, vec3(0.), vec3(0.), rd, 0., vec3(0.));
  vec2 h = sph(ro, rd, R_OUT);
  if (h.x < 0.) return false;
  vec3 p = ro + rd*h.x;
  if ((uJarInv*p).y > BODY_TOP) return false;           // the neck is drawn by the glass walk
  float dummy = 0.;
  vec3 n = p/R_OUT;
  P.keep *= 1. - schlick(-dot(rd, n), .04);
  vec3 d = bend(rd, n, 1./ng, dummy);
  vec2 hi = sph(p, d, R_IN);
  if (hi.x <= 0.){                                       // grazing: the ray only skims through the glass
    float tg = sph(p, d, R_OUT).y; P.glass = tg;
    vec3 q = p + d*tg;
    P.exitDir = bend(d, -q/R_OUT, ng, dummy);
    return true;
  }
  P.glass = hi.x;
  p += d*hi.x;
  bool wet = p.y < SEA + swell(p.xz);
  float nm = wet ? nw : 1.;
  P.keep *= 1. - schlick(abs(dot(d, p/R_IN)), wet ? .004 : .04);
  d = bend(d, p/R_IN, ng/nm, dummy);

  float wy = 0.;
  for (int seg = 0; seg < 3; seg++){
    float tWall = sph(p, d, R_IN).y;
    // the sea's surface, if this stretch crosses it in the right direction
    float tS = 1e9;
    if (abs(d.y) > 1e-4){
      float t0 = (SEA - p.y)/d.y;
      if (t0 > 1e-3 && t0 < tWall && ((wet && d.y > 0.) || (!wet && d.y < 0.))){
        for (int k = 0; k < 3; k++){ vec3 q = p + d*t0; t0 += (SEA + swell(q.xz) - q.y)/d.y; }
        if (t0 > 1e-3 && t0 < tWall) tS = t0;
      }
    }
    float tEnd = min(tWall, tS);
    // the brain: note where this stretch passes closest to it
    if (P.uv.x < 0.){
      float s = clamp(dot(uBrainPos - p, d), 0., tEnd);
      vec3 q = p + d*s;
      if (length(q - uBrainPos) < .8){ P.uv = toUV(q); P.brainP = q; P.toBrain = P.water + (wet ? max(s - .25, 0.) : 0.); }
    }
    if (wet){ wy += (p.y + .5*d.y*tEnd)*tEnd; if (P.wLen == 0.){ P.wO = p; P.wD = d; P.wLen = tEnd; } P.water += tEnd; }
    p += d*tEnd;
    if (tS < tWall){
      vec3 ns = swellNormal(p.xz);
      P.surf = 1.; P.surfP = p; P.surfN = ns; P.surfD = d;
      if (wet){
        float tir = 0.;
        d = bend(d, -ns, nw, tir);                       // water to air, or mirrored back down
        if (tir > 0.) P.tir = 1.; else { wet = false; nm = 1.; P.keep *= 1. - schlick(abs(d.y), .02); }
      } else {
        P.keep *= 1. - schlick(-dot(d, ns), .02);
        d = bend(d, ns, 1./nw, dummy);                   // air into water
        wet = true; nm = nw;
      }
      continue;
    }
    // out through the back wall
    P.wallP = p;
    d = bend(d, -p/R_IN, nm/ng, dummy);
    float tg = sph(p, d, R_OUT).y;
    P.glass += tg;
    p += d*tg;
    P.exitDir = bend(d, -p/R_OUT, ng, dummy);
    break;
  }
  if (P.water > 0.) P.waterY = wy/P.water;
  return true;
}

void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec2 sp = (gl_FragCoord.xy - .5*uRes)/uRes.y*uView;
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCam*vec3(sp, -CAM_D));

  // blur levels are picked by size on screen, so the glow looks the same at any resolution
  float L = log2(uRes.y/uView);                 // log2 of pixels per world unit
  vec3 glowCol = textureLod(uSpecimen, vec2(.5), L - 1.5).rgb/uScale;   // the brain's light, averaged

  /* what is seen through the bowl, one colour at a time */
  const vec3 NG = vec3(1.512, 1.518, 1.532);   // crown glass, red to blue
  const vec3 NW = vec3(1.331, 1.335, 1.343);   // sea water, red to blue
  vec3 inner = vec3(0.);
  float cover = 0., insideBowl = 0.;
  Path G;                                       // the green path, used for the water and the glow
  for (int c = 0; c < 3; c++){
    Path P;
    if (!traceBowl(ro, rd, NG[c], NW[c], P)) continue;
    insideBowl = 1.;
    if (P.uv.x >= 0.){
      vec2 c0 = toUV(uBrainPos), off = (P.uv - c0)*vec2(uRes.x/uRes.y, 1.)*uView;
      float r = length(off);
      float push = ring(r, uRipples.x) + ring(r, uRipples.y);
      P.uv += normalize(off + 1e-5)/vec2(uRes.x/uRes.y, 1.)/uView*push*.02*uRipple;
    }
    vec4 b = P.uv.x < 0. ? vec4(0.) : texture(uSpecimen, P.uv);
    // light from the room, bent by the whole jar (the ball of water turns it upside down)
    float behindRoom = studio(P.exitDir)[c]*uBrainBehind;
    float v = b[c]/uScale + (1. - b.a)*behindRoom;
    if (b.a > 0.){
      // the waves focus the lamp into a moving net of light on the brain's upper side
      float cau = causticAt(P.brainP)[c];
      float up = smoothstep(uBrainPos.y - .25, uBrainPos.y + .35, P.brainP.y);
      v *= mix(1., .55 + .45*cau, uCaustics*up);
      v += uLampCol[c]*cau*.05*uCaustics*up*b.a;
    }
    // glass is faintly green: long paths through it, at the edges, take on its colour
    v *= exp(-P.glass*vec3(2.2, .55, 1.6)[c]*uGlassTint);
    v *= P.keep;
    inner[c] = v;
    if (c == 1){ G = P; cover = b.a; }
  }

  if (insideBowl > 0.){
    // the brain's own glow, softened by the water around it
    vec2 guv = G.uv.x < 0. ? vec2(-1.) : G.uv;
    vec3 bloom = guv.x < 0. ? vec3(0.) :
      (soft(guv, L - 6.3).rgb*.36 + soft(guv, L - 5.3).rgb*.34 + soft(guv, L - 4.3).rgb*.26 + soft(guv, L - 3.3).rgb*.14)/uScale*uPulse;
    inner += bloom*(1. - .85*cover)*G.keep*uBloom;

    float wet = mix(G.water, G.toBrain, cover);      // the brain hides the water behind it
    if (G.water > 0.){
      // Beer-Lambert: each colour fades with the distance travelled through water; the water adds its own dim glow
      vec3 sigma = -log(max(uWaterTint, vec3(1e-3)))*uClarity;
      float lift = smoothstep(-.95, SEA, G.waterY);                    // 0 at the bottom, 1 at the surface
      inner = inner*exp(-sigma*wet)
            + (uInscat*uMurk*(.35 + .65*lift) + glowCol*.03*uPulse*uWaterGlow)*(1. - exp(-wet*1.6))*G.keep;

      // god rays: walk the ray through the water, gathering lamp light wherever the waves focus it
      if (uRaySteps > 0 && G.wLen > 0.){
        vec3 Lw = lightIn();
        float len = min(mix(G.wLen, min(G.wLen, G.toBrain), cover), 2.);
        float ds = len/float(uRaySteps);
        float jit = hash(gl_FragCoord.xy + fract(uTime*7.31)*113.);
        vec3 acc = vec3(0.);
        for (int i = 0; i < 32; i++){
          if (i >= uRaySteps) break;
          float tr = (float(i) + jit)*ds;
          vec3 q = G.wO + G.wD*tr;
          float depth = SEA - q.y;
          if (depth < 0.) continue;
          vec2 bed = q.xz + Lw.xz*((q.y - CPLANE)/(-Lw.y));
          vec3 cc = textureLod(uCaustic, clamp(bed*.5 + .5, 0., 1.), 2.2).rgb;
          float shaft = pow(max(dot(cc, vec3(.333)) - .75, 0.), 1.4)*1.6 + .04;
          acc += shaft*exp(-sigma*(depth/max(-Lw.y, .2) + tr))*ds;
        }
        inner += uLampCol*acc*.06*uGodRays*G.keep;
      }
      // the lamp's light pools in a net on the floor of the bowl
      inner += uLampCol*causticAt(G.wallP)*.02*uCaustics*smoothstep(-.3, -.75, G.wallP.y)*exp(-sigma*G.water)*(1. - cover)*G.keep;
      // specks adrift and bubbles climbing
      float sparkle = motes(sp, 9., .05, 1.)*.5 + motes(sp, 17., .09, 2.)*.35 + motes(sp, 5.5, .16, 3.)*.9;
      // each beat sends a faint ring of light rolling out through the water
      vec2 rc = (uv - toUV(uBrainPos))*vec2(uRes.x/uRes.y, 1.)*uView;
      float rr = length(rc);
      float front = max(ring(rr, uRipples.x), 0.) + .6*max(ring(rr, uRipples.y), 0.);
      vec3 hue = glowCol/max(max(glowCol.r, glowCol.g), 1e-4);          // the brain's colour, at full strength
      inner += hue*front*.09*uRipple*(1. - cover)*smoothstep(.3, .5, rr)*G.keep;
      inner += (uLampCol*.25 + uInscat*6.)*sparkle*.4*uMotes*(1. - .7*cover)*(.4 + .6*lift);
    }
    if (G.surf > 0.){
      float ripple = dot(causticAt(G.surfP - vec3(0., .3, 0.)), vec3(.333));
      if (G.tir > 0.){
        // seen from below at a steep angle the surface is a silver mirror: it shows the sea under it
        inner += (uInscat*10. + uLampCol*.02*ripple)*G.keep;
      } else if (G.surfD.y < 0.){
        // seen from above it mirrors the room
        float F = schlick(clamp(-dot(G.surfD, G.surfN), 0., 1.), .02);
        vec3 R = reflect(G.surfD, G.surfN);
        inner = mix(inner, studio(R), F) + uLampCol*pow(max(dot(R, -uLampDir), 0.), 900.)*6.;   // glints of the lamp
      } else {
        // a window up out of the water, rimmed with light
        inner += uLampCol*ripple*.05*G.keep;
      }
    }
  }

  /* the glass itself: reflections off every face, walked along the straight ray */
  vec3 front = vec3(0.), behind = vec3(0.);
  float trans = 1.;
  float bb = dot(ro, rd), bc = dot(ro, ro) - 1.32*1.32, bh = bb*bb - bc;
  if (bh > 0.){
    float tIn = -bb - sqrt(bh), tOut = -bb + sqrt(bh), tMid = -bb;
    float sgn = 1., t = max(tIn, 0.);
    int crossings = 0;
    for (int i = 0; i < 110; i++){
      vec3 p = ro + rd*t;
      float d = jar(p)*sgn;
      if (d < .0008){
        vec3 n = jarNormal(p);
        if (dot(n, rd) > 0.) n = -n;
        float ndv = clamp(-dot(n, rd), 0., 1.);
        float F = schlick(ndv, .04);
        vec3 r = reflect(rd, n);
        vec3 e = studio(r);
        // the brain mirrored in the glass
        vec3 toB = uBrainPos - p; float tb = dot(toB, r);
        vec3 mirrored = vec3(0.);
        if (tb > 0.){
          float inside = dot(n, toB) > 0. ? 1. : .35;
          mirrored = soft(toUV(p + r*tb), L - 5.).rgb/uScale*inside;
        }
        // light caught in the thick base
        vec3 pl = uJarInv*p;
        float base = smoothstep(-.78, -.86, pl.y)*smoothstep(.42, .36, length(pl.xz));
        vec3 caught = glowCol*base*.10*(.4 + .6*(1. - ndv));
        // the bright line where the sea meets the glass (the meniscus)
        float line = smoothstep(.018, .0, abs(p.y - SEA - swell(p.xz)))*step(length(p), 1.);
        caught += vec3(.6, .9, .95)*line*.35;
        float w = crossings < 2 ? 1. : .35;        // the far wall reads much fainter
        vec3 add = trans*(w*F*e*uGlassRefl + mirrored*F*.2 + caught);
        if (t < tMid) front += add; else behind += add;
        trans *= (1. - F)*.985;
        crossings++;
        sgn = -sgn;
        t += .003;
      } else {
        t += max(d, .0012);
      }
      if (t > tOut) break;
    }
    // outside the bowl's body (the neck, lip and foot), the glass is seen straight through
    if (insideBowl < 1.) inner += behind;
    else inner += behind*.3*(1. - cover);
  }

  vec3 col = inner + front;

  col *= uScale;                                 // stored in range on devices without high-range targets
  outColor = vec4(col, 1.);
}
</script>


<!-- the finishing pass: filmic tone curve, grade, a little lens fringing, vignette and grain -->
<script id="post-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uImg;
uniform vec2 uRes;
uniform float uTime, uScale, uExposure, uContrast, uSat, uFringe, uVignette, uGrain;
uniform vec3 uShadowTint;
out vec4 outColor;
vec3 aces(vec3 x){ return clamp(x*(2.51*x + .03)/(x*(2.43*x + .59) + .14), 0., 1.); }
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec2 c = uv - .5; float r2 = dot(c, c);
  vec2 off = c*r2*.02*uFringe;
  vec3 col = vec3(texture(uImg, uv + off).r, texture(uImg, uv).g, texture(uImg, uv - off).b)/uScale;
  col = aces(col*uExposure*.75);
  col = mix(col, col*col*(3. - 2.*col), uContrast);
  float luma = dot(col, vec3(.2126, .7152, .0722));
  col = max(mix(vec3(luma), col, uSat), 0.);
  col += uShadowTint*smoothstep(.004, .05, luma)*(1. - smoothstep(.05, .35, luma))*.1;   // true black stays black
  col *= 1. - smoothstep(.12, .62, r2)*uVignette;
  col = pow(col, vec3(1./2.2));
  float n = hash(gl_FragCoord.xy + fract(uTime)*61.) - .5;
  col += n*(1./255. + uGrain*.035*smoothstep(.0, .08, luma));
  outColor = vec4(col, 1.);
}
</script>

<!-- the ripple simulation (after Evan Wallace's WebGL Water): drops, then waves spreading cell to cell -->
<script id="sim-drop-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uCenter; uniform float uRadius, uStrength;
out vec4 outColor;
void main(){
  vec2 uv = gl_FragCoord.xy/vec2(textureSize(uTex, 0));
  vec4 info = texture(uTex, uv);
  float d = max(0., 1. - length(uCenter*.5 + .5 - uv)/uRadius);
  info.r += (.5 - cos(d*3.14159)*.5)*uStrength;
  outColor = info;
}
</script>
<script id="sim-step-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uRDisc, uDamp;
out vec4 outColor;
void main(){
  vec2 size = vec2(textureSize(uTex, 0)), uv = gl_FragCoord.xy/size, dl = 1./size;
  vec4 info = texture(uTex, uv);
  float avg = (texture(uTex, uv - vec2(dl.x, 0.)).r + texture(uTex, uv + vec2(dl.x, 0.)).r
             + texture(uTex, uv - vec2(0., dl.y)).r + texture(uTex, uv + vec2(0., dl.y)).r)*.25;
  info.g += (avg - info.r)*2.;
  info.g *= uDamp;
  info.r += info.g;
  info.r *= .998;
  if (length(uv*2. - 1.) > uRDisc){ info.r = 0.; info.g = 0.; }   // the glass: waves bounce back off it
  outColor = info;
}
</script>

<!-- caustics: every point of the surface bends the lamp's light down onto a plane; where the light is
     squeezed together it is brighter. One draw per colour, each with water's index for that colour. -->
<script id="caustic-vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
uniform float uTime;
uniform int uGrid;
uniform float uEta;
uniform vec3 uLampDir;
//WATER
out vec2 vOld, vNew;
out float vIn;
const float CPLANE = -.05;
void main(){
  int cell = gl_VertexID/6, corner = gl_VertexID - cell*6;
  int ci = cell - (cell/uGrid)*uGrid, cj = cell/uGrid;
  ivec2 o = corner == 0 ? ivec2(0, 0) : corner == 1 ? ivec2(1, 0) : corner == 2 ? ivec2(0, 1)
          : corner == 3 ? ivec2(1, 0) : corner == 4 ? ivec2(1, 1) : ivec2(0, 1);
  vec2 p = (vec2(ci + o.x, cj + o.y)/float(uGrid)*2. - 1.)*uRDisc;
  vIn = step(length(p), uRDisc);
  vec3 N = waterN(p, 2);
  vec3 P = vec3(p.x, waterH(p), p.y);
  vec3 r = refract(uLampDir, N, uEta), rf = refract(uLampDir, vec3(0., 1., 0.), uEta);
  vec3 hit = P + r*((P.y - CPLANE)/max(-r.y, .05));
  vOld = p + rf.xz*((uSea - CPLANE)/(-rf.y));
  vNew = hit.xz;
  gl_Position = vec4(hit.x, hit.z, 0., 1.);
}
</script>
<script id="caustic-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec3 uChan;
in vec2 vOld, vNew;
in float vIn;
out vec4 outColor;
void main(){
  float oldA = length(dFdx(vOld))*length(dFdy(vOld));
  float newA = length(dFdx(vNew))*length(dFdy(vNew));
  outColor = vec4(uChan*clamp(oldA/max(newA, 1e-9), 0., 6.)*vIn, 1.);
}
</script>

<script src="../../vendor/browser.global.js"></script>
<script>
(async () => {
  const cv = document.getElementById('cv'), note = document.getElementById('note');
  const fail = msg => { if (msg) note.textContent = msg; note.classList.add('on'); };
  const gl = cv.getContext('webgl2', { antialias:false, alpha:false, powerPreference:'high-performance' });
  if (!gl) return fail();

  /* ---- programs */
  const src = id => document.getElementById(id).textContent;
  const withStudio = s => s.replace('//STUDIO', src('studio')).replace('//WATER', src('water'));
  function program(vs, fs){
    const p = gl.createProgram();
    for (const [type, text] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]){
      const s = gl.createShader(type); gl.shaderSource(s, text.trim()); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++){ const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }
  const brainProg = program(src('brain-vs'), withStudio(src('brain-fs')));
  const FULL = '#version 300 es\nvoid main(){ vec2 p = vec2(gl_VertexID == 1 ? 3. : -1., gl_VertexID == 2 ? 3. : -1.); gl_Position = vec4(p, 0., 1.); }';
  const sceneProg = program(FULL, withStudio(src('scene-fs')));
  const postProg = program(FULL, src('post-fs'));
  const dropProg = program(FULL, src('sim-drop-fs'));
  const stepProg = program(FULL, src('sim-step-fs'));
  const causticProg = program(withStudio(src('caustic-vs')), src('caustic-fs'));
  const emptyVao = gl.createVertexArray();

  /* ---- the model: 48 bytes a vertex (position, normal, uv, tangent, handedness), 16-bit triangles */
  let verts, tris, tissueImg, normalImg;
  try {
    const bin = async path => { const r = await fetch(path); if (!r.ok) throw new Error(path); return r.arrayBuffer(); };
    const img = async path => { const i = new Image(); i.src = path; await i.decode(); return i; };
    [verts, tris, tissueImg, normalImg] = await Promise.all([bin('assets/anatomy.bin'), bin('assets/triangles.bin'), img('assets/tissue.webp'), img('assets/normals.webp')]);
  } catch (e) {
    return fail('The brain model could not be loaded. Open this page through a web server rather than straight from disk.');
  }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  [[0, 3, 0], [1, 3, 12], [2, 2, 24], [3, 3, 32]].forEach(([loc, n, off]) => { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 48, off); });
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, tris, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  const triCount = tris.byteLength/2;

  const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
  function imageTexture(image){
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 4);
    return t;
  }
  const tissue = imageTexture(tissueImg), normals = imageTexture(normalImg);

  /* ---- the brain is drawn off-screen first (smooth-edged, in high range where the device allows),
          then its mip chain gives the blurred copies the glow is built from */
  const hdr = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  const FORMAT = hdr ? gl.RGBA16F : gl.RGBA8, SCALE = hdr ? 1 : 1/5;
  const samples = Math.min(4, gl.getParameter(gl.MAX_SAMPLES));
  const msFbo = gl.createFramebuffer(), msColor = gl.createRenderbuffer(), msDepth = gl.createRenderbuffer();
  const resFbo = gl.createFramebuffer(), specimen = gl.createTexture();
  function allocate(w, h){
    gl.bindRenderbuffer(gl.RENDERBUFFER, msColor); gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, FORMAT, w, h);
    gl.bindRenderbuffer(gl.RENDERBUFFER, msDepth); gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT16, w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, msFbo);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, msColor);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, msDepth);
    gl.bindTexture(gl.TEXTURE_2D, specimen);
    gl.texImage2D(gl.TEXTURE_2D, 0, FORMAT, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, resFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, specimen, 0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, FORMAT, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
  }
  function target(w, h, mips){
    const tex = gl.createTexture(), fbo = gl.createFramebuffer();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, FORMAT, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fbo, w, h };
  }
  const sceneTex = gl.createTexture(), sceneFbo = gl.createFramebuffer();
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const SIM = 256;
  let simA = target(SIM, SIM, false), simB = target(SIM, SIM, false);   // the ripple simulation needs high range: off without it
  const caustic = target(512, 512, true);

  /* ---- sizing: sharp, but never more pixels than the shader can comfortably fill */
  const QUALITY = { High:{ rays:24, oct:5, grid:200, pixels:2.6e6 }, Balanced:{ rays:12, oct:3, grid:140, pixels:1.8e6 }, Low:{ rays:0, oct:2, grid:0, pixels:1.1e6 } };
  let quality = QUALITY.High;
  let W = 0, H = 0;
  function resize(){
    const cw = cv.clientWidth, ch = cv.clientHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    dpr = Math.min(dpr, Math.sqrt(quality.pixels/Math.max(1, cw*ch)));
    const w = Math.max(1, Math.round(cw*dpr)), h = Math.max(1, Math.round(ch*dpr));
    if (w !== W || h !== H){ W = cv.width = w; H = cv.height = h; allocate(W, H); }
    draw();
  }

  /* ---- the controls: every light, the sea, the grade and the beat (DialKit) */
  const cfg = {
    Beat: {
      bpm:[34, 10, 120, 1],              // beats a minute
      strength:[.18, 0, 1, .01],         // how much brighter the brain gets on a beat
      softness:[.75, 0, 1, .01],         // 0 = a sharp thump, 1 = a slow swell and fade
      secondBeat:[.35, 0, 1, .01],       // the softer echo after the first thump
      echoGap:[.2, .05, .45, .01],       // time between the two, as a share of the beat
      swell:[.010, 0, .06, .001],        // how much the brain grows on a beat
      lightWave:[.45, 0, 2, .01],        // the wave of light that runs through the folds
    },
    Ripples: {
      height:[2, 0, 5, .01],             // rings on the surface, and the pressure wave through the water
      speed:[.8, .1, 2, .01],
    },
    Brain: {
      body:"#ff700f",
      core:"#ff9223",
      glow:[1, 0, 3, .01],
      rimLight:[1, 0, 3, .01],
      wetness:[1, 0, 3, .01],
      highlights:[1, 0, 3, .01],
      haloInWater:[.75, 0, 3, .01],
    },
    Jar: {
      reflections:[1, 0, 3, .01],
      softboxLeft:[1, 0, 3, .01],
      windowRight:[1, 0, 3, .01],
      lampAbove:[1, 0, 3, .01],
      edgeLight:[1, 0, 3, .01],
      glassTint:[1, 0, 4, .01],
      roomThroughWater:[.45, 0, 2, .01],
    },
    Sea: {
      level:[.73, .3, .85, .01],
      waterColour:"#a9cdc2",           // what survives a hand's width of water (darker = murkier)
      clarity:[.7, 0, 4, .01],          // how strongly the water swallows colour with distance
      glow:"#122522",                    // the water's own dim colour, seen where it is deep
      murk:[1, 0, 4, .01],
      waves:[.45, 0, 2, .01],            // the long rolling waves
      chop:[.6, 0, 2, .01],              // the fine sharp chop on top
      slosh:[.5, 0, 2, .01],             // the whole bowl rocking; tilting the jar sets it going
      particles:[.8, 0, 3, .01],
      brainLightsWater:[.35, 0, 4, .01],
    },
    Light: {
      lamp:"#a9c6bd",                    // the cold lamp above the jar
      strength:[1, 0, 4, .01],
      caustics:[1, 0, 3, .01],           // the moving net of light the waves throw
      godRays:[1, 0, 4, .01],
    },
    Grade: {
      exposure:[1.1, .2, 3, .01],
      contrast:[.35, 0, 1, .01],
      saturation:[.85, 0, 1.6, .01],
      shadowTint:"#123030",
      lensFringe:[.6, 0, 3, .01],
      vignette:[.5, 0, 1, .01],
      grain:[.5, 0, 2, .01],
    },
    Quality: {
      level:{ type:'select', options:['High', 'Balanced', 'Low'], default:'High' },
    },
  };
  const cfgDefaults = c => {
    const o = {};
    for (const [k, v] of Object.entries(c)){
      if (k === '_collapsed') continue;
      o[k] = Array.isArray(v) ? v[0]
        : (v && typeof v === 'object') ? (v.type === 'select' ? v.default : v.type ? v : cfgDefaults(v))
        : v;
    }
    return o;
  };
  let P = cfgDefaults(cfg);
  let ready = false;
  let raf = 0, last = 0;
  try {
    if (window.DialKit){
      DialKit.createDialRoot({ position:'top-right', theme:'dark', defaultOpen: innerWidth > 800 });
      DialKit.createDialKit('Brain in a jar', cfg, { id:'brain-jar-v3', persist:true }).subscribe(v => { const q = QUALITY[v.Quality.level] || QUALITY.High; P = v; if (q !== quality){ quality = q; if (ready){ W = 0; resize(); } } wake(); });
    }
  } catch (e) { console.warn('Controls unavailable', e); }
  // colours from the panel are sRGB; the shaders work in linear light
  const lin = h => { h = String(h).replace('#', ''); if (h.length === 3) h = [...h].map(x => x + x).join(''); return [0, 2, 4].map(i => Math.pow(parseInt(h.substr(i, 2), 16)/255, 2.2)); };

  /* ---- motion: only the jar moves when dragged; the brain and the camera stay put */
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const tilt = { roll:0, pitch:0, troll:0, tpitch:0 };
  const LIMIT = .55;
  let drag = null;
  cv.addEventListener('pointerdown', e => { if (e.button) return; cv.setPointerCapture(e.pointerId); drag = { id:e.pointerId, x:e.clientX, y:e.clientY }; });
  cv.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const k = 2.2/Math.min(innerWidth, innerHeight);
    tilt.troll  = Math.max(-LIMIT, Math.min(LIMIT, tilt.troll - (e.clientX - drag.x)*k));
    tilt.tpitch = Math.max(-LIMIT, Math.min(LIMIT, tilt.tpitch + (e.clientY - drag.y)*k));
    drag.x = e.clientX; drag.y = e.clientY;
    wake();
  });
  const release = e => { if (drag && drag.id === e.pointerId) drag = null; };
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
  cv.addEventListener('dblclick', () => { tilt.troll = tilt.tpitch = 0; wake(); });

  const rotXY = (ax, ay) => {                      // rotate about x, then y (column-major mat3)
    const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
    return [cy, 0, -sy,  sy*sx, cx, cy*sx,  sy*cx, -sx, cy*cx];
  };
  const transpose = m => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
  const mul = (A, B) => { const o = []; for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++){ let v = 0; for (let k = 0; k < 3; k++) v += A[k*3 + i]*B[j*3 + k]; o[j*3 + i] = v; } return o; };
  const rotX = a => [1, 0, 0,  0, Math.cos(a), Math.sin(a),  0, -Math.sin(a), Math.cos(a)];
  const rotZ = a => [Math.cos(a), Math.sin(a), 0,  -Math.sin(a), Math.cos(a), 0,  0, 0, 1];
  const IDENT = [1, 0, 0, 0, 1, 0, 0, 0, 1];

  /* ---- the heartbeat: a phase that advances with the tempo, so changing the speed never jumps */
  let time = 0, phase = 0;
  const ripples = [99, 99, 99];                    // seconds since each of the last three beats
  const drops = [];                                // beats waiting to be dropped into the ripple simulation
  let simClock = 0;

  /* ---- the sea's long waves (Gerstner): fixed directions and lengths, amplitudes from the panel */
  const WAVES = [.95, .72, .55, .43, .33, .26, .2, .15].map((l, i) => {
    const ang = .62 + [0, .55, -.5, .95, -.85, .28, -.32, 1.25][i], k = 2*Math.PI/l;
    return { dx:Math.cos(ang), dz:Math.sin(ang), k, a:.0185*Math.pow(l/.95, .8), w:Math.sqrt(2.7*k), p0:(i*2.399)%6.283 };
  });
  const waveBuf = new Float32Array(32), phaseBuf = new Float32Array(8);
  /* ---- the slosh: the bowl's water rocks like a pendulum; tilting the jar pushes it */
  const slosh = { x:0, vx:0, z:0, vz:0, lastRoll:0, lastPitch:0, rollV:0, pitchV:0 };
  function stepSlosh(dt){
    if (dt <= 0) return;
    const rv = (tilt.roll - slosh.lastRoll)/dt, pv = (tilt.pitch - slosh.lastPitch)/dt;
    const ra = (rv - slosh.rollV)/dt, pa = (pv - slosh.pitchV)/dt;
    slosh.lastRoll = tilt.roll; slosh.lastPitch = tilt.pitch; slosh.rollV = rv; slosh.pitchV = pv;
    const w = 4.2, z = .07, K = .0035;
    slosh.vx += (-w*w*slosh.x - 2*z*w*slosh.vx + ra*K)*dt; slosh.x += slosh.vx*dt;
    slosh.vz += (-w*w*slosh.z - 2*z*w*slosh.vz - pa*K)*dt; slosh.z += slosh.vz*dt;
    slosh.x = Math.max(-.08, Math.min(.08, slosh.x)); slosh.z = Math.max(-.08, Math.min(.08, slosh.z));
  }
  const LAMP_DIR = (() => { const v = [.18, -.82, -.55], l = Math.hypot(...v); return v.map(x => x/l); })();
  const rDisc = sea => Math.sqrt(Math.max(.986*.986 - sea*sea, 0));
  function setWater(u, t){
    const amp = P.Sea.waves;
    WAVES.forEach((w, i) => { waveBuf.set([w.dx, w.dz, w.k, w.a*amp], i*4); phaseBuf[i] = w.w*t + w.p0; });
    gl.uniform4fv(u['uWaves[0]'], waveBuf);
    gl.uniform1fv(u['uWPhase[0]'], phaseBuf);
    const a = .012*P.Sea.slosh;
    gl.uniform4f(u.uSlosh, slosh.x + a*Math.sin(t*.61), slosh.z + a*.8*Math.sin(t*.47 + 1.2), a*.3*Math.sin(t*1.13), a*.3*Math.sin(t*.97 + .4));
    gl.uniform1f(u.uDetailAmp, .011*P.Sea.chop);
    gl.uniform1f(u.uRDisc, rDisc(P.Sea.level));
    gl.uniform1f(u.uSimOn, hdr ? 1 : 0);
    gl.uniform1i(u.uDetailOct, quality.oct);
    gl.uniform1f(u.uSea, P.Sea.level);
    gl.uniform1f(u.uTime, t);
  }
  function fullscreen(){ gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  function simPass(prog, set){
    gl.bindFramebuffer(gl.FRAMEBUFFER, simB.fbo); gl.viewport(0, 0, SIM, SIM);
    gl.useProgram(prog.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, simA.tex); gl.uniform1i(prog.u.uTex, 0);
    set(prog.u); fullscreen();
    [simA, simB] = [simB, simA];
  }
  function beatShape(ph){
    // two soft bumps (a beat and its echo); softness widens them until they melt into one swell
    const w = .035 + .17*P.Beat.softness;
    const bump = c => { let d = Math.abs(ph - c); d = Math.min(d, 1 - d); return Math.exp(-(d/w)*(d/w)); };
    return Math.min(1, bump(.15) + P.Beat.secondBeat*bump(.15 + P.Beat.echoGap));
  }
  function advance(dt){
    time += dt;
    const before = phase % 1;
    phase += dt*P.Beat.bpm/60;
    const now = phase % 1;
    for (let i = 0; i < 3; i++) ripples[i] += dt;
    if ((before < .15 && now >= .15) || (now < before && now >= .15)){ ripples.pop(); ripples.unshift(0); drops.push(1); }
  }

  function draw(){
    if (!W) return;
    const t = time, D = 9;
    // fit the jar: it is ~2.2 tall and ~2.05 wide
    const view = Math.max(3.11, 2.75*H/W);
    // the camera is fixed, a little above the jar's middle
    const cam = rotXY(-.085, 0);
    const camPos = [cam[6]*D, cam[7]*D + .015, cam[8]*D];
    const J = mul(rotZ(tilt.roll), rotX(tilt.pitch));
    // the brain is fixed in place; it only floats up and down a hair
    const brain = IDENT;
    const brainPos = [0, -.03 + Math.sin(t*.5)*.008, 0];
    const beat = beatShape(phase % 1);
    const pulse = 1 + P.Beat.strength*beat;
    const lights = [P.Jar.softboxLeft, P.Jar.windowRight, P.Jar.lampAbove, P.Jar.edgeLight];

    // 0: the ripple simulation and the caustics, both driven by the same surface
    if (hdr){
      gl.disable(gl.BLEND);
      const R = rDisc(P.Sea.level);
      for (const _ of drops.splice(0)) simPass(dropProg, u => { gl.uniform2f(u.uCenter, brainPos[0], brainPos[2]); gl.uniform1f(u.uRadius, .045); gl.uniform1f(u.uStrength, .016*P.Ripples.height); });
      let steps = 0;
      while (simClock >= 1 && steps < 4){ simPass(stepProg, u => { gl.uniform1f(u.uRDisc, R); gl.uniform1f(u.uDamp, .993); }); simClock -= 1; steps++; }
      if (steps === 4) simClock = 0;
      gl.bindFramebuffer(gl.FRAMEBUFFER, caustic.fbo); gl.viewport(0, 0, caustic.w, caustic.h);
      const off = quality.grid === 0;
      gl.clearColor(off ? .8 : 0, off ? .8 : 0, off ? .8 : 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      if (!off){
        gl.useProgram(causticProg.p);
        const u = causticProg.u;
        setWater(u, t);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, simA.tex); gl.uniform1i(u.uSim, 1);
        gl.uniform1i(u.uGrid, quality.grid); gl.uniform3fv(u.uLampDir, LAMP_DIR);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
        gl.bindVertexArray(emptyVao);
        [[[1, 0, 0], 1/1.331], [[0, 1, 0], 1/1.335], [[0, 0, 1], 1/1.343]].forEach(([chan, eta]) => {
          gl.uniform3fv(u.uChan, chan); gl.uniform1f(u.uEta, eta);
          gl.drawArrays(gl.TRIANGLES, 0, quality.grid*quality.grid*6);
        });
        gl.disable(gl.BLEND);
      }
      gl.bindTexture(gl.TEXTURE_2D, caustic.tex); gl.generateMipmap(gl.TEXTURE_2D);
    }

    // 1: the brain
    gl.bindFramebuffer(gl.FRAMEBUFFER, msFbo);
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(brainProg.p);
    let u = brainProg.u;
    gl.uniformMatrix3fv(u.uBrain, false, brain);
    gl.uniform3fv(u.uBrainPos, brainPos);
    gl.uniform3fv(u.uCamPos, camPos);
    gl.uniformMatrix3fv(u.uCamInv, false, transpose(cam));
    gl.uniformMatrix3fv(u.uEnvRot, false, IDENT);
    gl.uniform4fv(u.uLights, lights);
    gl.uniform2f(u.uProj, D/(.5*view*W/H), D/(.5*view));
    gl.uniform1f(u.uPulse, pulse); gl.uniform1f(u.uTime, t); gl.uniform1f(u.uScale, SCALE);
    gl.uniform1f(u.uSwell, 1 + P.Beat.swell*beat);
    gl.uniform3fv(u.uBody, lin(P.Brain.body)); gl.uniform3fv(u.uCore, lin(P.Brain.core));
    gl.uniform1f(u.uGlow, P.Brain.glow); gl.uniform1f(u.uRimB, P.Brain.rimLight);
    gl.uniform1f(u.uWet, P.Brain.wetness); gl.uniform1f(u.uSpec, P.Brain.highlights);
    gl.uniform1f(u.uBeatPhase, phase - .15); gl.uniform1f(u.uBeatWave, P.Beat.lightWave);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tissue); gl.uniform1i(u.uTissue, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, normals); gl.uniform1i(u.uNormals, 1);
    gl.bindVertexArray(vao);
    gl.drawElements(gl.TRIANGLES, triCount, gl.UNSIGNED_SHORT, 0);
    gl.bindVertexArray(null);
    gl.disable(gl.DEPTH_TEST);

    // 2: smooth its edges into a texture, and blur it down the mip chain
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msFbo); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resFbo);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, specimen);
    gl.generateMipmap(gl.TEXTURE_2D);

    // 3: the jar, the sea, the glow — in high range, into the scene texture
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.viewport(0, 0, W, H);
    gl.useProgram(sceneProg.p);
    u = sceneProg.u;
    setWater(u, t);
    gl.uniform2f(u.uRes, W, H);
    gl.uniform1f(u.uView, view);
    gl.uniform3fv(u.uCamPos, camPos);
    gl.uniformMatrix3fv(u.uCam, false, cam);
    gl.uniformMatrix3fv(u.uEnvRot, false, IDENT);
    gl.uniform4fv(u.uLights, lights);
    gl.uniformMatrix3fv(u.uJar, false, J);
    gl.uniformMatrix3fv(u.uJarInv, false, transpose(J));
    gl.uniform3fv(u.uBrainPos, brainPos);
    gl.uniform1f(u.uPulse, pulse); gl.uniform1f(u.uScale, SCALE);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, specimen); gl.uniform1i(u.uSpecimen, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, simA.tex); gl.uniform1i(u.uSim, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, caustic.tex); gl.uniform1i(u.uCaustic, 2);
    gl.uniformMatrix3fv(u.uCamInv, false, transpose(cam));
    gl.uniform2f(u.uProjUV, D/(view*W/H), D/view);
    const lamp = lin(P.Light.lamp).map(x => x*P.Light.strength);
    gl.uniform3fv(u.uWaterTint, lin(P.Sea.waterColour)); gl.uniform3fv(u.uInscat, lin(P.Sea.glow));
    gl.uniform3fv(u.uLampCol, lamp); gl.uniform3fv(u.uLampDir, LAMP_DIR);
    gl.uniform1f(u.uMurk, P.Sea.murk); gl.uniform1f(u.uClarity, P.Sea.clarity);
    gl.uniform1f(u.uMotes, P.Sea.particles); gl.uniform1f(u.uWaterGlow, P.Sea.brainLightsWater);
    gl.uniform1f(u.uCaustics, hdr ? P.Light.caustics : 0); gl.uniform1f(u.uGodRays, hdr ? P.Light.godRays : 0);
    gl.uniform1i(u.uRaySteps, hdr ? quality.rays : 0);
    gl.uniform3fv(u.uRipples, ripples);
    gl.uniform1f(u.uRipple, P.Ripples.height); gl.uniform1f(u.uRippleSpeed, P.Ripples.speed);
    gl.uniform1f(u.uGlassRefl, P.Jar.reflections); gl.uniform1f(u.uGlassTint, P.Jar.glassTint);
    gl.uniform1f(u.uBloom, P.Brain.haloInWater); gl.uniform1f(u.uBrainBehind, P.Jar.roomThroughWater);
    fullscreen();

    // 4: the finishing pass, to the screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(postProg.p);
    u = postProg.u;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(u.uImg, 0);
    gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uTime, t); gl.uniform1f(u.uScale, SCALE);
    gl.uniform1f(u.uExposure, P.Grade.exposure); gl.uniform1f(u.uContrast, P.Grade.contrast);
    gl.uniform1f(u.uSat, P.Grade.saturation); gl.uniform3fv(u.uShadowTint, lin(P.Grade.shadowTint));
    gl.uniform1f(u.uFringe, P.Grade.lensFringe); gl.uniform1f(u.uVignette, P.Grade.vignette); gl.uniform1f(u.uGrain, P.Grade.grain);
    fullscreen();
  }

  function frame(now){
    raf = 0;
    const dt = Math.min(.05, (now - last)/1000 || 0); last = now;
    const k = still.matches ? 1 : 1 - Math.exp(-dt*5);
    if (!still.matches) advance(dt);
    tilt.roll += (tilt.troll - tilt.roll)*k; tilt.pitch += (tilt.tpitch - tilt.pitch)*k;
    if (!still.matches){ stepSlosh(dt); simClock += dt*120*P.Ripples.speed; }
    draw();
    if (!still.matches) wake();
  }
  function wake(){ if (!raf && !document.hidden) raf = requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', () => { last = performance.now(); wake(); });
  still.addEventListener('change', () => { last = performance.now(); wake(); });
  cv.addEventListener('webglcontextlost', e => e.preventDefault());
  cv.addEventListener('webglcontextrestored', () => location.reload());

  new ResizeObserver(resize).observe(cv);
  ready = true;
  resize();
  cv.classList.add('on');
  last = performance.now();
  wake();

  window.__brain = { draw, tilt, params: () => P, set: (roll, pitch, t) => { tilt.roll = tilt.troll = roll; tilt.pitch = tilt.tpitch = pitch; if (t != null){ ripples.fill(99); advance(t); if (ripples[0] < 99) ripples[0] = ((phase % 1) - .15 + 1) % 1*60/P.Beat.bpm; } draw(); } };
})().catch(e => { console.error(e); const n = document.getElementById('note'); n.textContent = 'Something went wrong drawing this piece.'; n.classList.add('on'); });
</script>
</body>
</html>
