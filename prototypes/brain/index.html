<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Brain in a jar — prototype</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .no-gl{position:fixed;inset:0;display:none;place-items:center;color:rgba(255,255,255,.6);font:300 13px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:24px}
  .no-gl.on{display:grid}
</style>
</head>
<body>
<canvas id="cv" aria-label="A glowing amber brain floating inside a round glass jar"></canvas>
<p class="no-gl" id="nogl">This piece needs WebGL 2, which this browser doesn't offer.</p>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp sampler2D;

uniform vec2  uRes;
uniform float uTime;
uniform float uView;      // world units across the screen height
uniform vec3  uCamPos;
uniform mat3  uCam;       // camera basis (columns: right, up, back)
uniform mat3  uBrainRot;  // world -> brain
uniform vec3  uBrainPos;
uniform float uPulse;
uniform sampler2D uFold;
out vec4 outColor;

const float CAM_D = 9.0;
const vec3  BR  = vec3(.535, .60, .38);   // brain half-size: across, front-to-back, top-to-bottom
const float AMP = .042;                    // how deep the grooves cut

float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b - a)/k, 0., 1.); return mix(b, a, h) - k*h*(1. - h); }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }

/* ---------- brain ---------- */
// the brain is seen from above: +y is the front, +z the crown, facing the camera
vec3 egg(vec3 p){ p.x /= 1. - .11*p.y/BR.y; return p; }
float sdEll(vec3 p){ float k0 = length(p/BR), k1 = length(p/(BR*BR)); return k0*(k0 - 1.)/k1; }
float foldH(vec3 p){
  vec3 d = normalize(p/BR);
  vec2 uv = d.xy*sqrt(2./(1. + max(d.z, -.7)));       // equal-area map of the upper dome
  return textureLod(uFold, uv*.40 + vec2(.47, .21), 0.).r;
}
float sdBrain(vec3 p, out float h){
  p = egg(p);
  h = foldH(p);
  float d = sdEll(p) + AMP*(1. - h);
  // the split between the two halves, a touch wider at the front and back
  float gap = .010 + .05*smoothstep(.75, 1.05, abs(p.y)/BR.y);
  return smax(d, gap - abs(p.x), .045);
}
float sdBrain(vec3 p){ float h; return sdBrain(p, h); }
vec3 brainNormal(vec3 p){
  const vec2 e = vec2(1., -1.)*.0022;
  return normalize(e.xyy*sdBrain(p + e.xyy) + e.yyx*sdBrain(p + e.yyx) + e.yxy*sdBrain(p + e.yxy) + e.xxx*sdBrain(p + e.xxx));
}

// colours are linear light: the tone curve at the end turns strong orange into yellow, then white
const vec3 AMBER = vec3(1., .17, .002);
const vec3 DEEP  = vec3(.085, .008, .0);
const vec3 HOT   = vec3(1., .31, .014);

// how close a point is to the lit heart of the brain (1 at the heart)
float heart(vec2 p){ vec2 q = (p - vec2(0., -.10))/vec2(.34, .40); return exp(-1.5*dot(q, q)); }

vec3 shadeBrain(vec3 p, vec3 n, vec3 v, float h){
  float ndv = clamp(dot(n, v), 0., 1.);
  float crown = smoothstep(.08, .8, h);
  float core = heart(p.xy)*uPulse;
  // slow waves of light travelling through the folds
  float wave = .5 + .5*sin(7.*h + 5.*length(p.xy - vec2(.0, -.1)) - uTime*.9);
  core *= .86 + .22*wave;

  // the amber surface, lit softly from the front; grooves fall off to a deep red-brown
  vec3 c = mix(DEEP, AMBER*.9, crown)*(.12 + .88*ndv*ndv*ndv);
  // light from within: the crowns near the heart burn yellow, the grooves between them stay orange
  c += mix(vec3(1., .15, .002)*1.1, HOT*3.8, crown*crown)*core;
  // thin edges let a little light through
  c += vec3(1., .14, .0)*pow(1. - ndv, 2.5)*(.25 + .6*core);
  // wet highlights
  vec3 l1 = normalize(vec3(-.35, .55, .76)), l2 = normalize(vec3(.5, -.25, .83));
  float s = pow(max(dot(n, normalize(l1 + v)), 0.), 90.)*1.3 + pow(max(dot(n, normalize(l2 + v)), 0.), 50.)*.5;
  c += vec3(1., .7, .3)*s*crown;
  return c;
}

/* ---------- jar ---------- */
float sdBox2(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
// the jar's profile, spun around the y axis: q = (distance from the axis, height)
float jar2(vec2 q){
  const float T = .0115;
  float body = abs(length(q) - 1.) - T;
  body = max(body, q.y - .925);
  body = max(body, -.935 - q.y);
  float neck = max(abs(q.x - .392) - T, abs(q.y - .965) - .055);
  float shell = smin(body, neck, .05);
  float lip  = sdBox2(q - vec2(.445, 1.035), vec2(.068, .05), .046);
  float foot = sdBox2(q - vec2(0., -.878), vec2(.365, .07), .028);
  return min(smin(shell, lip, .025), smin(shell, foot, .03));
}
float jar(vec3 p){ return jar2(vec2(length(p.xz), p.y)); }
vec3 jarNormal(vec3 p){
  float r = max(length(p.xz), 1e-4);
  vec2 q = vec2(r, p.y);
  const vec2 e = vec2(.0015, 0.);
  vec2 g = vec2(jar2(q + e.xy) - jar2(q - e.xy), jar2(q + e.yx) - jar2(q - e.yx));
  return normalize(vec3(g.x*p.x/r, g.y, g.x*p.z/r));
}

// the dark studio around the jar: two tall strip lights beside and a little behind it
vec3 env(vec3 r){
  float a  = abs(atan(r.x, -r.z));              // 0 = straight behind the jar
  float el = asin(clamp(r.y, -1., 1.));
  float side = r.x < 0. ? 1. : .82;
  float strip = smoothstep(.20, .07, abs(a - 1.30))*smoothstep(1.12, .45, abs(el));
  float thin  = smoothstep(.05, .015, abs(a - .78))*smoothstep(.9, .3, abs(el));
  float back  = smoothstep(.75, 0., a)*(.5 + .5*smoothstep(-.6, .5, r.y));
  float top   = smoothstep(.55, .98, r.y);
  return vec3(.93, .96, 1.)*(strip*15.*side + thin*2. + back*.24 + top*2.2 + .01);
}

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }

void main(){
  vec2 sp = (gl_FragCoord.xy - .5*uRes)/uRes.y*uView;
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCam*vec3(sp, -CAM_D));

  vec3 col = vec3(0.);

  // nothing lives outside this sphere
  float bb = dot(ro, rd), bc = dot(ro, ro) - 1.32*1.32, bh = bb*bb - bc;
  if (bh > 0.){
    float tIn = -bb - sqrt(bh), tOut = -bb + sqrt(bh);

    /* brain */
    vec3 bo = uBrainRot*(ro - uBrainPos), bd = uBrainRot*rd;
    vec3 so = bo/(BR + .01), sd = bd/(BR + .01);       // into the space where its bounds are a unit sphere
    float sa = dot(sd, sd), sb = dot(so, sd), sc = dot(so, so) - 1., sh = sb*sb - sa*sc;
    float tBrain = 1e9, dMin = 1e9;
    vec3 brainCol = vec3(0.);
    vec3 pNear = bo - bd*(sb/sa);                      // where the ray passes closest
    if (sh > 0.){
      float t = (-sb - sqrt(sh))/sa, tEnd = (-sb + sqrt(sh))/sa;
      float h; bool hit = false;
      for (int i = 0; i < 80; i++){
        float d = sdBrain(bo + bd*t, h);
        dMin = min(dMin, d);
        if (d < .0012){ hit = true; break; }
        t += d*.5;
        if (t > tEnd) break;
      }
      if (hit){
        vec3 p = bo + bd*t;
        brainCol = shadeBrain(egg(p), brainNormal(p), -bd, h);
        tBrain = t; dMin = 0.;
      } else {
        // looking straight down the split: the light inside shows through
        brainCol = HOT*5.*heart(pNear.xy)*uPulse*smoothstep(.03, .0, abs(pNear.x));
      }
    } else {
      dMin = max(sdEll(egg(pNear)), 0.);
    }

    /* glass: walk through every surface the ray crosses in front of the brain */
    vec3 glass = vec3(0.);
    float trans = 1., sgn = 1., t = max(tIn, 0.);
    int crossings = 0;
    float tStop = min(tOut, tBrain);
    for (int i = 0; i < 110; i++){
      vec3 p = ro + rd*t;
      float d = jar(p)*sgn;
      if (d < .0008){
        vec3 n = jarNormal(p);
        if (dot(n, rd) > 0.) n = -n;
        float ndv = clamp(-dot(n, rd), 0., 1.);
        float F = .035 + .965*pow(1. - ndv, 5.);
        vec3 r = reflect(rd, n);
        vec3 e = env(r);
        // the brain's glow, mirrored and smeared in the glass
        vec3 toB = uBrainPos - p; float tb = max(dot(toB, r), 0.);
        float miss = length(toB - r*tb);
        e += AMBER*uPulse*.45*smoothstep(.7, .2, miss)*step(.001, tb);
        float w = crossings < 2 ? 1. : .4;                 // the far wall reads much fainter
        glass += trans*w*(F*e + vec3(.55, .6, .66)*.02*pow(1. - ndv, 1.5));
        crossings++;
        trans *= (1. - F)*.985;
        sgn = -sgn;
        t += .003;
      } else {
        t += max(d, .0012);
      }
      if (t > tStop) break;
    }

    // light bleeding off the brain into the air around it
    vec3 halo = vec3(1., .30, .003)*1.3*exp(-dMin*22.) + AMBER*.4*exp(-dMin*9.);
    halo *= smoothstep(.34, .03, dMin);
    halo *= uPulse;

    // the faint parts of the glass break up into a printed dot screen, as in the reference
    float lum = dot(glass, vec3(.3, .55, .15));
    float cell = uRes.y/300.;
    vec2 gp = gl_FragCoord.xy/cell;
    vec2 gq = fract(vec2(gp.x + gp.y, gp.x - gp.y)*.7071) - .5;
    float rad = sqrt(clamp(lum*2.4, 0., 1.))*.62;
    float dots = smoothstep(rad + .7/cell, rad - .7/cell, length(gq));
    glass = mix(glass*dots*1.9, glass, smoothstep(.16, .5, lum));

    col = (brainCol + halo*(tBrain < 1e8 ? .35 : 1.))*trans + glass;
  }

  col = 1. - exp(-col*1.25);
  col = pow(col, vec3(1./2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime)*61.) - .5)/255.;   // breaks up banding in the dark
  outColor = vec4(col, 1.);
}
</script>

<script>
(() => {
  const cv = document.getElementById('cv');
  const gl = cv.getContext('webgl2', { antialias:false, alpha:false, powerPreference:'high-performance' });
  if (!gl){ document.getElementById('nogl').classList.add('on'); return; }

  /* ---- the folds: a labyrinth grown from noise (activator / inhibitor), used as a height map */
  function makeFolds(N, ra, ri, iters){
    let s = 20261126;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; };
    const v = new Float32Array(N*N), A = new Float32Array(N*N), B = new Float32Array(N*N), T = new Float32Array(N*N);
    for (let i = 0; i < v.length; i++) v[i] = rnd()*2 - 1;
    const pass = (src, dst, r, dx) => {            // box blur along one axis, wrapping at the edges
      const w = 2*r + 1;
      for (let j = 0; j < N; j++){
        let sum = 0;
        for (let k = -r; k <= r; k++){ const i = (k + N) % N; sum += dx ? src[j*N + i] : src[i*N + j]; }
        for (let i = 0; i < N; i++){
          if (dx) dst[j*N + i] = sum/w; else dst[i*N + j] = sum/w;
          const out = (i - r + N) % N, inn = (i + r + 1) % N;
          sum += dx ? src[j*N + inn] - src[j*N + out] : src[inn*N + j] - src[out*N + j];
        }
      }
    };
    const blur = (src, dst, r) => { pass(src, T, r, 1); pass(T, dst, r, 0); pass(dst, T, r, 1); pass(T, dst, r, 0); };
    for (let it = 0; it < iters; it++){
      blur(v, A, ra); blur(v, B, ri);
      for (let i = 0; i < v.length; i++) v[i] = Math.tanh(1.6*(v[i] + 4*(A[i] - B[i]) + .2));
    }
    blur(v, A, ra - 2);                            // soften, so the crowns come out round
    const out = new Uint8Array(N*N);
    for (let i = 0; i < out.length; i++){
      const x = Math.min(1, Math.max(0, A[i]*.75 + .5));
      out[i] = Math.round(255*Math.sqrt(1 - (1 - x)*(1 - x)));
    }
    return out;
  }

  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, '#version 300 es\nvoid main(){ vec2 p = vec2(gl_VertexID == 1 ? 3. : -1., gl_VertexID == 2 ? 3. : -1.); gl_Position = vec4(p, 0., 1.); }'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const U = {};
  for (const n of ['uRes','uTime','uView','uCamPos','uCam','uBrainRot','uBrainPos','uPulse','uFold']) U[n] = gl.getUniformLocation(prog, n);

  const N = 384;
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, N, N, 0, gl.RED, gl.UNSIGNED_BYTE, makeFolds(N, 4, 9, 30));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.uniform1i(U.uFold, 0);

  /* ---- sizing: sharp, but never more pixels than the shader can comfortably fill */
  const MAX_PIXELS = 2.4e6;
  let W = 0, H = 0;
  function resize(){
    const cw = cv.clientWidth, ch = cv.clientHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    dpr = Math.min(dpr, Math.sqrt(MAX_PIXELS/Math.max(1, cw*ch)));
    const w = Math.max(1, Math.round(cw*dpr)), h = Math.max(1, Math.round(ch*dpr));
    if (w !== W || h !== H){ W = cv.width = w; H = cv.height = h; gl.viewport(0, 0, W, H); }
    draw();
  }

  /* ---- motion */
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const ptr = { x:0, y:0, tx:0, ty:0 };
  addEventListener('pointermove', e => { ptr.tx = e.clientX/innerWidth*2 - 1; ptr.ty = e.clientY/innerHeight*2 - 1; });
  addEventListener('pointerleave', () => { ptr.tx = ptr.ty = 0; });
  document.addEventListener('mouseleave', () => { ptr.tx = ptr.ty = 0; });

  const rotXY = (ax, ay) => {                      // rotate about x, then y (column-major mat3)
    const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
    return [cy, 0, -sy,  sy*sx, cx, cy*sx,  sy*cx, -sx, cy*cx];
  };
  const transpose = m => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];

  let time = 0;
  function draw(){
    const t = time;
    // fit the jar: it is ~2.2 tall and ~2.05 wide
    const view = Math.max(3.11, 2.75*H/W);
    // the camera sits a little above the jar's middle and drifts with the pointer
    const pitch = -.085 - ptr.y*.07, yaw = ptr.x*.16;
    const cam = rotXY(pitch, yaw);
    const D = 9, ty = .015;
    const camPos = [cam[6]*D, cam[7]*D + ty, cam[8]*D];
    // the brain hangs in the liquid: it bobs and sways very slightly
    const brain = rotXY(Math.sin(t*.37)*.045 - ptr.y*.05, Math.sin(t*.23 + 1.3)*.07 + ptr.x*.08);
    const pulse = 1 + .07*Math.sin(t*.8) + .03*Math.sin(t*2.1 + .7);

    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uView, view);
    gl.uniform3fv(U.uCamPos, camPos);
    gl.uniformMatrix3fv(U.uCam, false, cam);
    gl.uniformMatrix3fv(U.uBrainRot, false, transpose(brain));
    gl.uniform3f(U.uBrainPos, 0, -.035 + Math.sin(t*.5)*.012, 0);
    gl.uniform1f(U.uPulse, pulse);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  let raf = 0, last = 0;
  function frame(now){
    raf = 0;
    const dt = Math.min(.05, (now - last)/1000 || 0); last = now;
    time += dt;
    const k = 1 - Math.exp(-dt*4);
    ptr.x += (ptr.tx - ptr.x)*k; ptr.y += (ptr.ty - ptr.y)*k;
    draw();
    play();
  }
  function play(){ if (!raf && !document.hidden && !still.matches) raf = requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', () => { last = performance.now(); play(); });
  still.addEventListener('change', () => { last = performance.now(); play(); });
  addEventListener('pointermove', () => { if (still.matches) { ptr.x = ptr.tx; ptr.y = ptr.ty; draw(); } });

  new ResizeObserver(resize).observe(cv);
  resize();
  last = performance.now();
  play();

  window.__brain = { draw, setTime: v => { time = v; draw(); } };
})();
</script>
</body>
</html>
